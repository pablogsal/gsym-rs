name: Coverage

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  coverage:
    name: Rust coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install interoperability tools
        env:
          LLVM_VERSION: "20"
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils-x86-64-linux-gnu \
            "clang-${LLVM_VERSION}" "llvm-${LLVM_VERSION}"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov

      - name: Build the instrumented CLI
        run: >-
          cargo llvm-cov run
          --package gsym-rs
          --bin gsymtool
          --all-features
          --no-report
          --
          --version

      - name: Collect workspace coverage
        run: >-
          cargo llvm-cov
          --no-clean
          --workspace
          --all-features
          --locked
          --lcov
          --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: lcov.info
          disable_search: true
          fail_ci_if_error: true
          flags: rust
          name: gsym-rs
