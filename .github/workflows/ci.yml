name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Format, lints, and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The fuzz crate is its own workspace and builds into its own target
          # directory, which the default configuration would not cache.
          workspaces: |
            . -> target
            fuzz -> fuzz/target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint the workspace with every feature
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Lint the workspace without default features
        run: cargo clippy --all-targets --no-default-features --locked -- -D warnings

      # The library and the tools must not panic on any input they accept, so
      # they are held to a stricter bar than the tests and benches, where a
      # panic on a broken fixture is the assertion.
      - name: Forbid panicking constructs in the library and the tools
        run: |
          cargo clippy --workspace --lib --bins --all-features --locked -- \
            -D warnings \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic \
            -D clippy::unreachable \
            -D clippy::indexing_slicing \
            -D clippy::arithmetic_side_effects

      - name: Lint the fuzz targets
        run: cargo clippy --manifest-path fuzz/Cargo.toml --bins --locked -- -D warnings

      - name: Check the fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml --bins --locked

      - name: Build the documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The default `llvm` metapackage on Ubuntu 24.04 is LLVM 18, whose
      # yaml2obj rejects fixtures this suite uses. The test harness accepts any
      # versioned tool it can find, so pin the newest LLVM the distribution
      # ships and fail here, loudly, if it ever stops providing the oracles.
      - name: Install the ELF, DWARF, and GSYM interoperability oracles
        env:
          LLVM_VERSION: "20"
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            "clang-${LLVM_VERSION}" "llvm-${LLVM_VERSION}"
          "llvm-gsymutil-${LLVM_VERSION}" --version | head -n 2
          "yaml2obj-${LLVM_VERSION}" --version | head -n 2
          "llvm-dwp-${LLVM_VERSION}" --version | head -n 2

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Workspace feature unification already resolves the library to every
      # feature, so a separate default-feature run would repeat this one.
      - name: Test with every feature
        run: cargo test --workspace --all-features --locked

      - name: Test without default features
        run: cargo test --no-default-features --locked

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Taking the version from the manifest is what keeps this job and
      # rust-version from drifting apart.
      - id: rust
        name: Read the declared Rust version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["rust-version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml declares Rust $version"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Whether the declared baseline still compiles is the question here; the
      # test job above answers what the code does.
      - name: Compile everything with the declared baseline
        run: cargo check --workspace --all-targets --all-features --locked

  features:
    name: Feature powerset
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@b27e114ddbae5cc01df19a22cf70a124d5177567 # v2.86.0
        with:
          tool: cargo-hack

      # Checking the library alone keeps criterion and proptest out of eight
      # passes; the test and msrv jobs compile the test targets. (--no-dev-deps
      # would do the same, but it rewrites the manifest and so cannot be
      # combined with --locked.)
      - name: Check every combination of the library features
        run: cargo hack check --package gsym-rs --feature-powerset --locked

  portability:
    name: Portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The reader, writer, and transcoder are portable; only the ELF/DWARF
      # converter tests and the gsymtool interoperability tests are gated to
      # Linux, where the LLVM oracles run.
      - name: Test the portable library surface
        run: cargo test --package gsym-rs --no-default-features --features mmap,convert --locked

  package:
    name: Package for crates.io
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: List the packaged files
        run: cargo package --package gsym-rs --list --locked

      # This also compiles the crate from the packaged tarball, which is what
      # catches a file that the documentation includes but packaging drops.
      - name: Verify the package builds as published
        run: cargo publish --package gsym-rs --dry-run --locked

      - name: Validate the release contracts
        run: python3 scripts/release_contract.py --tag dry-run

  audit:
    name: Advisory audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@b27e114ddbae5cc01df19a22cf70a124d5177567 # v2.86.0
        with:
          tool: cargo-audit

      - name: Audit the locked dependency graph
        run: cargo audit --deny warnings

  ci:
    name: CI complete
    needs: [quality, test, msrv, features, portability, package]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every required job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "a required job did not succeed" >&2
              exit 1
            fi
          done
