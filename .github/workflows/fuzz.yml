name: Fuzz

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "fuzz/**"
      - "examples/generate_fuzz_corpus.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/fuzz.yml"
  pull_request:
    paths:
      - "src/**"
      - "fuzz/**"
      - "examples/generate_fuzz_corpus.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "19 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: parse
            max_len: 65536
            dictionary: fuzz/gsym.dict
          - target: lookup
            max_len: 65536
            dictionary: fuzz/gsym.dict
          - target: roundtrip
            max_len: 8192
            dictionary: ""
          - target: mutate
            max_len: 8192
            dictionary: fuzz/gsym.dict
          - target: writer
            max_len: 8192
            dictionary: ""
          - target: elf_convert
            max_len: 65536
            dictionary: fuzz/elf.dict
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            fuzz -> fuzz/target

      # rust-cache restores this from its binary cache; the fuzz targets
      # themselves are built by the campaign below, and CI already checks that
      # they compile on every pull request.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Run campaign
        env:
          CAMPAIGN: ${{ github.event_name == 'schedule' && '-max_total_time=300' || '-runs=5000' }}
          DICTIONARY: ${{ matrix.dictionary }}
          MAX_LEN: ${{ matrix.max_len }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "fuzz/corpus/${TARGET}"
          libfuzzer=(
            "$CAMPAIGN"
            "-max_len=${MAX_LEN}"
            -timeout=10
            -rss_limit_mb=2048
          )
          if [[ -n "$DICTIONARY" ]]; then
            libfuzzer+=("-dict=${DICTIONARY}")
          fi
          cargo +nightly fuzz run "$TARGET" \
            "fuzz/corpus/${TARGET}" \
            "fuzz/seeds/${TARGET}" -- \
            "${libfuzzer[@]}"

      - name: Upload failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
