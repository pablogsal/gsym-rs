--- !ELF
FileHeader:
  Class: ELFCLASS64
  Data: ELFDATA2LSB
  Type: ET_EXEC
  Machine: EM_X86_64
Sections:
  - Name: .text
    Type: SHT_PROGBITS
    Flags: [ SHF_ALLOC, SHF_EXECINSTR ]
    Address: 0x1000
    Size: 0x100
DWARF:
  debug_str:
    - ''
    - main.cpp
  debug_abbrev:
    - ID: 0
      Table:
        - Code: 0x1
          Tag: DW_TAG_compile_unit
          Children: DW_CHILDREN_yes
          Attributes:
            - Attribute: DW_AT_name
              Form: DW_FORM_strp
        - Code: 0x2
          Tag: DW_TAG_subprogram
          Children: DW_CHILDREN_no
          Attributes:
            - Attribute: DW_AT_low_pc
              Form: DW_FORM_addr
            - Attribute: DW_AT_high_pc
              Form: DW_FORM_addr
            - Attribute: DW_AT_abstract_origin
              Form: DW_FORM_GNU_ref_alt
  debug_info:
    - Version: 4
      AbbrevTableID: 0
      AbbrOffset: 0x0
      AddrSize: 8
      Entries:
        - AbbrCode: 0x1
          Values:
            - Value: 0x1
        - AbbrCode: 0x2
          Values:
            - Value: 0x1000
            - Value: 0x1100
            - Value: 0x10
        - AbbrCode: 0x0
...
